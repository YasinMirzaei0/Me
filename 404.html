<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Page not found — MIRWEB</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<script>try{if(localStorage.getItem('th')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<script defer data-domain="your-domain.com" src="https://plausible.io/js/script.js"></script>
<style>
:root{--bg:#000;--fg:#f0f2f0;--muted:#8b8f8c;--accent:#f4ce15;color-scheme:dark;box-sizing:border-box}
:root[data-theme="light"]{--bg:#f0f2f0;--fg:#222124;--muted:#5f6360;--accent:#c9a100;color-scheme:light}
*,*:before,*:after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--fg) 18%,transparent) 1px,transparent 1.5px);background-size:22px 22px;-webkit-mask-image:radial-gradient(circle at 50% 55%,#000 0,transparent 70%);mask-image:radial-gradient(circle at 50% 55%,#000 0,transparent 70%);pointer-events:none}
header{position:relative;padding:calc(env(safe-area-inset-top,0px) + 22px) 28px 0;font-weight:800;font-size:clamp(16px,1.5vw,22px)}
header a{color:inherit;text-decoration:none}
main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px calc(env(safe-area-inset-bottom,0px) + 6vh)}
small{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
h1{margin:10px 0 0;font-weight:500;font-size:clamp(110px,26vw,380px);line-height:.9;letter-spacing:-.04em}
p{margin:22px 0 34px;max-width:440px;color:var(--muted);font-size:clamp(17px,1.6vw,20px);line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-block;padding:15px 26px;border-radius:999px;text-decoration:none;font-size:17px;border:1px solid color-mix(in srgb,var(--fg) 28%,transparent);color:var(--fg);transition:background .25s ease,color .25s ease}
.btn.main{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:hover{border-color:var(--fg)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<header><a href="/">MIRWEB®</a></header>
<main>
<small>Error</small>
<h1>404</h1>
<p>This page does not exist, or it has moved. Let’s get you back on track.</p>
<div class="row"><a class="btn main" href="/">Back to home</a><a class="btn" href="/blog/index.html">Read the blog</a></div>
</main>
</body>
</html>
